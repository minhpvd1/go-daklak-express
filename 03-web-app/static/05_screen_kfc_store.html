  <script>
    let isFollowing = false;
    function toggleStoreFollow() {
      isFollowing = !isFollowing;
      const btn = document.getElementById('btn-follow-store');
      const txt = document.getElementById('follow-text');
      if (isFollowing) {
        btn.className = 'flex-1 py-2 rounded-xl bg-neutral-100 border border-neutral-300 text-neutral-800 font-bold text-[13px] flex items-center justify-center space-x-1 active:scale-95 transition-all shadow-sm';
        txt.textContent = 'Đang theo dõi ✓';
      } else {
        btn.className = 'flex-1 py-2 rounded-xl bg-[#F9372D] hover:bg-[#D32F2F] text-white font-bold text-[13px] flex items-center justify-center space-x-1 active:scale-95 transition-all shadow-sm';
        txt.textContent = 'Theo dõi';
      }
    }
